<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <title>Under Construction</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #20231f;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 34rem);
      }

      .mark {
        display: block;
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 2.5rem;
        border: 0.5rem solid #20231f;
        border-radius: 50%;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      p {
        max-width: 26rem;
        margin: 0;
        color: #626761;
        font-size: 1.125rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"></span>
      <h1>Under construction.</h1>
      <p>Something new is on its way. Please check back soon.</p>
    </main>
  </body>
</html>
